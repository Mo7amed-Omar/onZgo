<!--
  ONZGO Logo — Dark variant (espresso letters + orange Z, for light/cream backgrounds)
  Replace this entire file with the official logo file when available.
  Dimensions: viewBox="0 0 240 80" — do NOT change viewBox.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 80" role="img" aria-label="ONZGO logo">
  <title>ONZGO</title>

  <!-- Speed lines -->
  <line x1="2"  y1="28" x2="14" y2="28" stroke="#F26B1D" stroke-width="3" stroke-linecap="round"/>
  <line x1="2"  y1="38" x2="18" y2="38" stroke="#F26B1D" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="2"  y1="48" x2="14" y2="48" stroke="#F26B1D" stroke-width="2" stroke-linecap="round"/>

  <!-- O with coffee-bean inside -->
  <g transform="translate(20, 10)">
    <rect x="0" y="0" width="42" height="60" rx="21" ry="21" fill="#3A1E17"/>
    <ellipse cx="21" cy="30" rx="11" ry="17" fill="none" stroke="#FFF6E9" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M21 13 Q28 30 21 47" fill="none" stroke="#FFF6E9" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- N -->
  <g transform="translate(68, 10)">
    <path d="M0 60 L0 0 L28 50 L28 0" fill="none" stroke="#3A1E17" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Z — orange -->
  <g transform="translate(103, 10)">
    <path d="M0 0 L30 0 L0 60 L30 60" fill="none" stroke="#F26B1D" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- G -->
  <g transform="translate(140, 10)">
    <path d="M30 18 Q30 0 15 0 Q0 0 0 30 Q0 60 15 60 Q30 60 30 45 L30 32 L16 32" fill="none" stroke="#3A1E17" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- O (second) -->
  <g transform="translate(178, 10)">
    <rect x="0" y="0" width="42" height="60" rx="21" ry="21" fill="none" stroke="#3A1E17" stroke-width="9"/>
  </g>

  <!-- Tagline -->
  <text x="120" y="76" text-anchor="middle" font-family="Cairo, Arial, sans-serif" font-size="9" font-weight="600" fill="#F26B1D" letter-spacing="4">BREW • BITES • VIBES</text>
</svg>
