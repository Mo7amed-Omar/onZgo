<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="ONZGO — قهوة طازجة، أجواء حلوة. Fresh coffee, good vibes." />
  <meta name="theme-color" content="#3A1E17" />

  <!-- Preconnect for Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Cairo — covers Arabic + Latin; weights 400, 600, 800, 900 -->
  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap"
    rel="stylesheet"
  />

  <!--
    Bootstrap 5.3.3 CSS — RTL by default (Arabic is default lang).
    id="bs-css" allows i18n.js to swap the href on language change.
  -->
  <link
    id="bs-css"
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css"
  />

  <!-- ONZGO Styles (in dependency order) -->
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/sections.css" />

  <title>ONZGO — قهوة ماشية</title>
</head>
<body>

  <!-- ═══════════════════════════════════════════════════════════
       0. FIXED HEADER
       ═══════════════════════════════════════════════════════════ -->
  <header class="onz-header" role="banner">

    <!-- Hamburger (inline-start) -->
    <div class="onz-header__hamburger">
      <button
        id="hamburger-btn"
        class="onz-hamburger"
        type="button"
        aria-controls="onz-offcanvas"
        aria-expanded="false"
        aria-label="فتح القائمة"
      >
        <span class="onz-hamburger__bar"></span>
        <span class="onz-hamburger__bar"></span>
        <span class="onz-hamburger__bar"></span>
        <span class="onz-sr-only">Menu</span>
      </button>
    </div>

    <!-- Logo (center) -->
    <div class="onz-header__logo">
      <a href="#" aria-label="ONZGO — الصفحة الرئيسية">
        <img
          src="assets/svg/logo-light.svg"
          alt="ONZGO"
          width="160"
          height="48"
          loading="eager"
          fetchpriority="high"
        />
      </a>
    </div>

    <!-- Language Toggle (inline-end) -->
    <div class="onz-header__lang">
      <button
        id="lang-toggle"
        class="onz-lang-toggle"
        type="button"
        aria-label="Switch to English"
      >EN</button>
    </div>

  </header><!-- /header -->


  <!-- ═══════════════════════════════════════════════════════════
       BOOTSTRAP OFFCANVAS — Full-screen Nav Overlay
       ═══════════════════════════════════════════════════════════ -->
  <div
    id="onz-offcanvas"
    class="onz-offcanvas offcanvas offcanvas-start"
    tabindex="-1"
    aria-labelledby="offcanvas-label"
  >
    <div class="offcanvas-header justify-content-end">
      <button
        type="button"
        class="btn-close"
        data-bs-dismiss="offcanvas"
        aria-label="إغلاق"
        data-i18n-attr="aria-label:navClose"
      ></button>
    </div>
    <div class="offcanvas-body">
      <nav aria-label="Main navigation" id="offcanvas-label">
        <a href="#brew"  class="onz-nav-link" data-offcanvas-close data-i18n="navBrew">القهوة</a>
        <a href="#vibes" class="onz-nav-link" data-offcanvas-close data-i18n="navVibes">الأجواء</a>
        <a href="#visit" class="onz-nav-link" data-offcanvas-close data-i18n="navVisit">زورونا</a>
        <!-- Menu PDF link -->
        <a
          href="assets/menu/menu-ar.pdf"
          class="onz-nav-link onz-nav-link--menu"
          data-menu-pdf
          target="_blank"
          rel="noopener noreferrer"
          aria-label="افتح قائمة المنيو"
          data-i18n-attr="aria-label:offcanvasMenuAria"
          data-i18n="navMenu"
        >شوف المنيو</a>
      </nav>
    </div>
  </div><!-- /offcanvas -->


  <!-- ═══════════════════════════════════════════════════════════
       MAIN CONTENT
       ═══════════════════════════════════════════════════════════ -->
  <main>

    <!-- ─────────────────────────────────────────────────────────
         1. HERO — Costa-inspired pour video, curtain reveal, badge
    ──────────────────────────────────────────────────────────── -->
    <section id="hero" class="onz-hero" aria-label="Hero">

      <!-- Video background wrap -->
      <div class="onz-hero-video-wrap">
        <video
          id="onz-hero-video"
          class="onz-hero-video"
          autoplay
          muted
          playsinline
          webkit-playsinline="true"
          x5-playsinline="true"
          disablePictureInPicture
          controlsList="nodownload nofullscreen noremoteplayback"
          preload="auto"
          poster="assets/video/hero-pour-poster.jpg"
          loop
          width="1280"
          height="720"
        >
          <!-- Mobile-first source: portrait 4:5 (614×768) -->
          <source
            media="(max-width: 767px)"
            src="assets/video/hero-pour-mobile.mp4"
            type="video/mp4"
          />
          <!-- Desktop source: landscape 16:9 (1280×720) -->
          <source
            src="assets/video/hero-pour.mp4"
            type="video/mp4"
          />
        </video>
      </div>

      <!-- Contrast & legibility gradient overlays -->
      <div class="onz-hero__overlay" aria-hidden="true"></div>

      <!-- Wavy bottom edge (reveals cream background below) -->
      <svg
        class="onz-hero__wave-bottom"
        viewBox="0 0 1200 60"
        preserveAspectRatio="none"
        aria-hidden="true"
        focusable="false"
      >
        <path
          d="M0,60 L0,20 C150,45 300,10 450,35 C600,60 750,15 900,40 C1050,65 1150,25 1200,30 L1200,60 Z"
          fill="#FFF6E9"
        />
      </svg>

      <!-- Headline (centered, single line, reveals after pour completes) -->
      <div class="onz-hero__text">
        <h1 class="onz-hero__headline" data-i18n-html="heroHeadline">
          قهوتك <span class="onz-highlight">ماشية معاك</span>.
        </h1>
      </div>

    </section><!-- /hero -->


    <!-- ─────────────────────────────────────────────────────────
         2. SQUIGGLE STRIP — Breathing pause / wave divider on cream
    ──────────────────────────────────────────────────────────── -->
    <div class="onz-squiggle-strip" role="separator" aria-hidden="true">
      <svg
        class="onz-squiggle-strip__svg"
        viewBox="0 0 1200 72"
        preserveAspectRatio="none"
        aria-hidden="true"
        focusable="false"
      >
        <path class="onz-squiggle-path"
          d="M0 20 C50 8,110 32,160 20 C210 8,270 32,320 20 C370 8,430 32,480 20
             C530 8,590 32,640 20 C690 8,750 32,800 20 C850 8,910 32,960 20
             C1010 8,1070 32,1120 20 C1150 12,1180 26,1200 20"
          stroke="#C9A579" stroke-width="2" stroke-linecap="round" fill="none"
        />
        <path class="onz-squiggle-path"
          d="M0 40 C50 28,110 52,160 40 C210 28,270 52,320 40 C370 28,430 52,480 40
             C530 28,590 52,640 40 C690 28,750 52,800 40 C850 28,910 52,960 40
             C1010 28,1070 52,1120 40 C1150 32,1180 46,1200 40"
          stroke="#C9A579" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"
        />
        <path class="onz-squiggle-path"
          d="M0 60 C30 50,70 68,100 60 C130 50,170 68,200 60 C230 50,270 68,300 60
             C330 50,370 68,400 60 C430 50,470 68,500 60 C530 50,570 68,600 60
             C630 50,670 68,700 60 C730 50,770 68,800 60 C830 50,870 68,900 60
             C930 50,970 68,1000 60 C1030 50,1070 68,1100 60 C1140 50,1180 68,1200 60"
          stroke="#F26B1D" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.35"
        />
      </svg>
    </div><!-- /squiggle-strip -->


    <!-- ─────────────────────────────────────────────────────────
         3. BREW — Cream block + cup photo band
    ──────────────────────────────────────────────────────────── -->
    <section id="brew" class="onz-brew" aria-labelledby="brew-title">

      <!-- Corner squiggle deco (top-end) -->
      <svg
        class="onz-squiggle-deco onz-squiggle-deco--tr"
        width="160" height="160"
        viewBox="0 0 160 160"
        aria-hidden="true" focusable="false"
        color="#3A1E17"
      >
        <path d="M140 20 C140 60,100 100,60 110 C30 118,10 100,25 75 C40 50,75 52,80 75"
          fill="none" stroke="currentColor" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M120 8 C125 18,110 28,115 36 C120 44,108 40,108 30"
          fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <circle cx="148" cy="12" r="4" fill="currentColor" opacity="0.4"/>
        <circle cx="138" cy="5"  r="2.5" fill="currentColor" opacity="0.3"/>
      </svg>

      <!-- Full-width cup photo band -->
      <div class="onz-brew__photo-band onz-reveal">

        <!-- Wavy cream top edge -->
        <svg class="onz-brew__band-wave-top" viewBox="0 0 1200 72"
          preserveAspectRatio="none" aria-hidden="true" focusable="false">
          <path d="M0,72 L0,28 C120,52 240,8 360,32 C480,56 600,12 720,36
                   C840,60 960,16 1080,40 C1140,52 1170,36 1200,30 L1200,72Z"
            fill="#FFF6E9"/>
        </svg>

        <!-- Cup Photo -->
        <img
          class="onz-brew__photo-cup"
          src="assets/img/cup.png"
          alt=""
          role="presentation"
          width="800"
          height="1000"
          loading="lazy"
          decoding="async"
        />

        <!-- Wavy cream bottom edge -->
        <svg class="onz-brew__band-wave-bot" viewBox="0 0 1200 72"
          preserveAspectRatio="none" aria-hidden="true" focusable="false">
          <path d="M0,0 L0,42 C120,20 240,62 360,38 C480,14 600,58 720,34
                   C840,10 960,54 1080,30 C1140,18 1170,44 1200,40 L1200,0Z"
            fill="#FFF6E9"/>
        </svg>

      </div><!-- /photo-band -->

      <!-- Content text & menu button -->
      <div class="container">
        <div class="onz-prose onz-reveal-group">
          <h2 class="onz-brew__title" id="brew-title" data-i18n="brewTitle">القهوة</h2>
          <p  class="onz-brew__body"  data-i18n="brewBody">قهوة طازجة على مزاجك.</p>
          <a
            class="onz-btn onz-btn--dark"
            href="assets/menu/menu-ar.pdf"
            data-menu-pdf
            target="_blank"
            rel="noopener noreferrer"
            aria-label="افتح قائمة المشروبات"
            data-i18n-attr="aria-label:brewBtnAria"
          >
            <span data-i18n="brewBtn">شوف المنيو</span>
            <svg class="onz-btn__arrow" viewBox="0 0 20 20" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round"
              aria-hidden="true">
              <path d="M4 10h12M12 6l4 4-4 4"/>
            </svg>
          </a>
        </div>
      </div>

    </section><!-- /brew -->


    <!-- ─────────────────────────────────────────────────────────
         4. VIBES — Espresso block + storefront photo
    ──────────────────────────────────────────────────────────── -->
    <section id="vibes" class="onz-vibes" aria-labelledby="vibes-title">

      <!-- Wavy top edge: espresso shape bites up into cream brew block -->
      <svg
        class="onz-vibes__wave-top"
        viewBox="0 0 1200 80"
        preserveAspectRatio="none"
        aria-hidden="true"
        focusable="false"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          d="M0 80 C150 10,300 70,450 40 C600 10,750 70,900 40
             C1050 10,1150 60,1200 40 L1200 80 Z"
          fill="#3A1E17"
        />
      </svg>

      <!-- Centered text block -->
      <div class="container">
        <div class="onz-vibes__text onz-prose onz-reveal-group">
          <h2 class="onz-vibes__title" id="vibes-title" data-i18n="vibesTitle">الأجواء</h2>
          <p  class="onz-vibes__body"  data-i18n="vibesBody">اقعد ريّح، أو خدها وامشي.</p>
        </div>
      </div>

      <!-- Full-bleed storefront photo with wavy top mask -->
      <div class="onz-vibes__img-wrap onz-reveal">
        <!-- Wavy SVG mask: espresso color flows over top of photo -->
        <svg
          class="onz-vibes__img-wave"
          viewBox="0 0 1200 60"
          preserveAspectRatio="none"
          aria-hidden="true"
          focusable="false"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M0 0 C200 60,400 0,600 40 C800 80,1000 10,1200 50 L1200 0 Z"
            fill="#3A1E17"
          />
        </svg>

        <img
          class="onz-vibes__storefront"
          src="assets/img/storefront.png"
          alt="واجهة متجر ONZGO"
          data-i18n-attr="alt:vibesImgAlt"
          width="1080"
          height="1440"
          loading="lazy"
        />
      </div>

    </section><!-- /vibes -->


    <!-- ─────────────────────────────────────────────────────────
         5. VISIT US — Cream block, address/hours/phone & directions
    ──────────────────────────────────────────────────────────── -->
    <section id="visit" class="onz-visit" aria-labelledby="visit-title">

      <!-- Wavy top edge: cream rises over espresso vibes section -->
      <svg
        class="onz-visit__wave-top"
        viewBox="0 0 1200 80"
        preserveAspectRatio="none"
        aria-hidden="true"
        focusable="false"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          d="M0 80 C200 15,400 65,600 35 C800 5,1000 55,1200 30 L1200 80 Z"
          fill="#FFF6E9"
        />
      </svg>

      <!-- Corner squiggle deco (bottom-end) -->
      <svg
        class="onz-squiggle-deco onz-squiggle-deco--br"
        width="160" height="160"
        viewBox="0 0 160 160"
        aria-hidden="true" focusable="false"
        color="#F26B1D"
      >
        <path d="M140 20 C140 70,90 110,50 100 C20 92,15 60,40 48 C60 38,85 55,80 75"
          fill="none" stroke="currentColor" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M8 60 C14 54,22 66,28 60 C34 54,42 66,48 60"
          fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="148" cy="140" r="4" fill="currentColor" opacity="0.4"/>
      </svg>

      <div class="container">
        <div class="onz-prose onz-reveal-group">
          <h2 class="onz-visit__title" id="visit-title" data-i18n="visitTitle">زورونا</h2>

          <div class="onz-visit__info">

            <!-- Address -->
            <div class="onz-visit__info-item">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 22s-8-4.5-8-11.8A8 8 0 0 1 12 2a8 8 0 0 1 8 8.2c0 7.3-8 11.8-8 11.8z"/>
                <circle cx="12" cy="10" r="3"/>
              </svg>
              <span data-i18n="visitAddress">القاهرة، مصر</span>
            </div>

            <!-- Hours -->
            <div class="onz-visit__info-item">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="10"/>
                <polyline points="12 6 12 12 16 14"/>
              </svg>
              <span data-i18n="visitHours">يومياً: ٧:٠٠ ص – ١٢:٠٠ م</span>
            </div>

            <!-- Phone -->
            <div class="onz-visit__info-item">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.15 12 19.79 19.79 0 0 1 1.08 3.38 2 2 0 0 1 3.05 1h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.09 8.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 21 16l.92.92z"/>
              </svg>
              <span data-i18n="visitPhone">+20 100 000 0000</span>
            </div>

          </div><!-- /info -->

          <!-- Directions button -->
          <a
            class="onz-btn onz-btn--dark"
            href="#"
            data-maps-link
            target="_blank"
            rel="noopener noreferrer"
            aria-label="افتح الموقع على الخريطة"
            data-i18n-attr="aria-label:visitBtnAria"
          >
            <span data-i18n="visitBtn">الاتجاهات</span>
            <svg class="onz-btn__arrow" viewBox="0 0 20 20" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round"
              aria-hidden="true">
              <path d="M4 10h12M12 6l4 4-4 4"/>
            </svg>
          </a>

        </div>
      </div>

    </section><!-- /visit -->

  </main><!-- /main -->


  <!-- ═══════════════════════════════════════════════════════════
       6. FOOTER — Espresso + orange accents, wavy top edge
       ═══════════════════════════════════════════════════════════ -->
  <footer class="onz-footer" aria-label="Site footer">

    <!-- Wavy top edge: espresso wave rises over cream visit section -->
    <svg
      class="onz-footer__wave-top"
      viewBox="0 0 1200 80"
      preserveAspectRatio="none"
      aria-hidden="true"
      focusable="false"
      xmlns="http://www.w3.org/2000/svg"
    >
      <path
        d="M0 80 C100 20,250 60,400 35 C550 10,700 60,850 30
           C1000 0,1100 50,1200 35 L1200 80 Z"
        fill="#3A1E17"
      />
    </svg>

    <div class="container text-center">

      <!-- Logo -->
      <div class="onz-footer__logo onz-reveal">
        <img
          src="assets/svg/logo-light.svg"
          alt="ONZGO"
          width="160"
          height="48"
          loading="lazy"
        />
      </div>

      <!-- Orange divider bar -->
      <div class="onz-footer__bar" aria-hidden="true"></div>

      <!-- Quick nav links — populated/updated by i18n.js -->
      <nav class="onz-footer__nav onz-reveal" id="footer-nav" aria-label="Footer navigation">
        <a href="#brew"  class="onz-footer__link">القهوة</a>
        <a href="#vibes" class="onz-footer__link">الأجواء</a>
        <a href="#visit" class="onz-footer__link">زورونا</a>
      </nav>

      <!-- Social icons — hidden if URL is placeholder (via i18n.js) -->
      <div class="onz-footer__socials onz-reveal" aria-label="Social media links">

        <!-- Instagram -->
        <span>
          <a
            href="#"
            class="onz-footer__social-link"
            data-social="instagram"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Instagram"
          >
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false">
              <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
            </svg>
          </a>
        </span>

        <!-- Facebook -->
        <span>
          <a
            href="#"
            class="onz-footer__social-link"
            data-social="facebook"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Facebook"
          >
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false">
              <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
            </svg>
          </a>
        </span>

      </div><!-- /socials -->

      <!-- Copyright -->
      <p class="onz-footer__copy onz-reveal" data-i18n="footerCopy">
        © ONZGO. جميع الحقوق محفوظة.
      </p>

    </div>

  </footer><!-- /footer -->


  <!-- ═══════════════════════════════════════════════════════════
       7. FLOATING ACTION BUTTON — WhatsApp
       Fixed bottom-end corner. Hidden until i18n.js confirms
       CONFIG.whatsapp is filled.
       ═══════════════════════════════════════════════════════════ -->
  <a
    class="onz-fab"
    href="#"
    aria-label="تواصل معنا على واتساب"
    target="_blank"
    rel="noopener noreferrer"
    hidden
  >
