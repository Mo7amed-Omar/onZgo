<!DOCTYPE html>
<html lang="ar" dir="rtl" class="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#3A1E17"/>
  <title>ONZGO — Brew • Bites • Vibes</title>
  <meta name="description" content="ONZGO coffee shop — أفضل قهوة، أشهى أكل، وأجمل أجواء"/>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>

  <style>
    /* ─────────────────────────────────────────────────
       TOKENS
    ───────────────────────────────────────────────── */
    :root {
      --espresso: #3A1E17;
      --orange:   #F26B1D;
      --cream:    #FFF6E9;
      --teal:     #2CBFA6;
      --blue:     #1F3BB3;
      --kraft:    #C9A579;
      --white:    #FFFFFF;

      --font: 'Cairo', sans-serif;
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
      --nav-h: 64px;
    }

    /* ─────────────────────────────────────────────────
       RESET
    ───────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; font-size: 16px; }
    body {
      font-family: var(--font);
      background: var(--cream);
      color: var(--espresso);
      overflow-x: hidden;
    }
    img { display: block; max-width: 100%; }
    a { color: inherit; text-decoration: none; }
    button { font-family: var(--font); cursor: pointer; border: none; background: none; }

    /* ─────────────────────────────────────────────────
       TYPOGRAPHY SCALE
    ───────────────────────────────────────────────── */
    .t-hero   { font-size: clamp(2.4rem, 8vw, 5rem);  font-weight: 900; line-height: 1.1; }
    .t-section{ font-size: clamp(1.8rem, 6vw, 3.5rem); font-weight: 800; line-height: 1.15; }
    .t-sub    { font-size: clamp(1rem, 3.5vw, 1.4rem); font-weight: 600; line-height: 1.6; }
    .t-pill   { font-size: clamp(0.85rem, 2.5vw, 1rem); font-weight: 700; letter-spacing: 0.04em; }

    /* ─────────────────────────────────────────────────
       UTILITIES
    ───────────────────────────────────────────────── */
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 0.5em;
      padding: 0.75em 1.75em;
      border-radius: 999px;
      transition: transform 0.2s var(--ease-out), box-shadow 0.2s;
    }
    .pill:active { transform: scale(0.96); }
    .pill-orange { background: var(--orange); color: var(--white); }
    .pill-orange:hover { box-shadow: 0 6px 24px #F26B1D55; transform: translateY(-2px); }
    .pill-cream  { background: var(--cream);  color: var(--espresso); }
    .pill-cream:hover  { box-shadow: 0 6px 24px #00000030; transform: translateY(-2px); }
    .pill-espresso { background: var(--espresso); color: var(--cream); }
    .pill-espresso:hover { box-shadow: 0 6px 24px #3A1E1755; transform: translateY(-2px); }

    /* ─────────────────────────────────────────────────
       NAV / HEADER
    ───────────────────────────────────────────────── */
    #header {
      position: fixed;
      inset-block-start: 0;
      inset-inline: 0;
      height: var(--nav-h);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-inline: 1.25rem;
      transition: background 0.35s, backdrop-filter 0.35s;
    }
    #header.scrolled {
      background: rgba(58,30,23,0.92);
      backdrop-filter: blur(12px);
    }

    #header .logo img {
      height: 40px;
      width: auto;
    }

    /* language toggle */
    #lang-btn {
      background: rgba(255,255,255,0.12);
      border: 1.5px solid rgba(255,255,255,0.35);
      border-radius: 999px;
      padding: 0.3em 0.9em;
      color: var(--cream);
      font-family: var(--font);
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      transition: background 0.2s;
    }
    #lang-btn:hover { background: rgba(255,255,255,0.22); }

    /* hamburger */
    #burger {
      width: 40px;
      height: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }
    #burger span {
      display: block;
      width: 22px;
      height: 2px;
      background: var(--cream);
      border-radius: 4px;
      transition: transform 0.3s, opacity 0.3s, width 0.3s;
    }
    #burger.open span:nth-child(1){ transform: translateY(7px) rotate(45deg); }
    #burger.open span:nth-child(2){ opacity: 0; }
    #burger.open span:nth-child(3){ transform: translateY(-7px) rotate(-45deg); }

    /* ─────────────────────────────────────────────────
       OVERLAY MENU
    ───────────────────────────────────────────────── */
    #overlay {
      position: fixed;
      inset: 0;
      background: var(--espresso);
      z-index: 99;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2.5rem;
      transform: translateX(100%);
      transition: transform 0.45s var(--ease-out);
    }
    html[dir="rtl"] #overlay { transform: translateX(-100%); }
    #overlay.open { transform: translateX(0); }

    #overlay nav a {
      display: block;
      text-align: center;
      font-size: clamp(1.6rem, 6vw, 2.8rem);
      font-weight: 800;
      color: var(--cream);
      letter-spacing: 0.02em;
      transition: color 0.2s;
    }
    #overlay nav a:hover { color: var(--orange); }

    #overlay .overlay-tagline {
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.25em;
      color: var(--kraft);
      text-transform: uppercase;
    }

    /* squiggle doodle in overlay */
    #overlay .doodle-bg {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.06;
    }

    /* ─────────────────────────────────────────────────
       HERO
    ───────────────────────────────────────────────── */
    #hero {
      position: relative;
      min-height: 100svh;
      background: var(--espresso);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding-block-end: 8vh;
      padding-inline: 1.5rem;
      overflow: hidden;
    }

    /* gradient layers */
    #hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 50% 0%, #6B3020 0%, transparent 70%),
        radial-gradient(ellipse 60% 40% at 50% 100%, #F26B1D22 0%, transparent 60%);
    }

    /* squiggle texture */
    #hero .squiggle-field {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.12;
    }

    /* cup image */
    #hero .cup-wrap {
      position: absolute;
      inset-block-start: 12%;
      left: 50%;
      transform: translateX(-50%);
      width: min(340px, 72vw);
      z-index: 1;
    }
    #hero .cup-wrap img {
      width: 100%;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 20px 40px rgba(0,0,0,0.6));
      animation: float 4s ease-in-out infinite;
    }
    @keyframes float {
      0%,100%{ transform: translateY(0); }
      50%{ transform: translateY(-12px); }
    }

    /* hero text */
    #hero .hero-text {
      position: relative;
      z-index: 2;
      text-align: center;
      color: var(--cream);
      max-width: 540px;
    }
    #hero .hero-text .eyebrow {
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.3em;
      color: var(--orange);
      text-transform: uppercase;
      margin-block-end: 0.75rem;
    }
    #hero .hero-text h1 {
      margin-block-end: 1.5rem;
    }
    #hero .hero-text h1 em {
      font-style: normal;
      color: var(--orange);
    }

    /* scroll cue */
    #hero .scroll-cue {
      position: absolute;
      inset-block-end: 2.5rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      opacity: 0.5;
      animation: bounce 2s ease-in-out infinite;
    }
    @keyframes bounce {
      0%,100%{ transform: translateX(-50%) translateY(0); }
      50%{ transform: translateX(-50%) translateY(6px); }
    }
    #hero .scroll-cue .bar {
      width: 1.5px;
      height: 28px;
      background: var(--cream);
      border-radius: 2px;
    }
    #hero .scroll-cue .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--cream);
    }

    /* ─────────────────────────────────────────────────
       WAVE DIVIDER
    ───────────────────────────────────────────────── */
    .wave-strip {
      width: 100%;
      overflow: hidden;
      line-height: 0;
      display: block;
    }
    .wave-strip svg { width: 100%; height: auto; display: block; }

    /* squiggle pattern strip */
    .squiggle-strip {
      background: var(--cream);
      padding-block: 0.6rem;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .squiggle-strip svg {
      width: 120%;
      min-width: 600px;
      opacity: 0.25;
    }

    /* ─────────────────────────────────────────────────
       SECTIONS — COMMON
    ───────────────────────────────────────────────── */
    .section-inner {
      max-width: 560px;
      margin-inline: auto;
      padding-inline: 1.5rem;
      padding-block: 5rem;
      text-align: center;
    }
    .section-inner .eyebrow {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      margin-block-end: 0.75rem;
      opacity: 0.65;
    }
    .section-inner h2 { margin-block-end: 1rem; }
    .section-inner p  { margin-block-end: 2rem; }

    /* ─────────────────────────────────────────────────
       BREW SECTION
    ───────────────────────────────────────────────── */
    #brew {
      background: var(--orange);
      color: var(--cream);
    }
    #brew .eyebrow { color: var(--cream); }
    #brew .menu-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      margin-block-end: 2rem;
    }
    #brew .menu-chip {
      background: rgba(255,255,255,0.18);
      border: 1.5px solid rgba(255,255,255,0.3);
      border-radius: 14px;
      padding: 0.8rem 0.5rem;
      font-size: 0.9rem;
      font-weight: 700;
    }

    /* ─────────────────────────────────────────────────
       BITES SECTION
    ───────────────────────────────────────────────── */
    #bites {
      background: var(--teal);
      color: var(--espresso);
    }
    #bites .bites-img-wrap {
      position: relative;
      border-radius: 24px;
      overflow: hidden;
      margin-block-end: 2rem;
      aspect-ratio: 4/3;
    }
    #bites .bites-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    #bites .bites-img-wrap .badge {
      position: absolute;
      inset-block-start: 1rem;
      inset-inline-end: 1rem;
      background: var(--espresso);
      color: var(--cream);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      padding: 0.35em 0.9em;
      border-radius: 999px;
    }

    /* ─────────────────────────────────────────────────
       VIBES SECTION
    ───────────────────────────────────────────────── */
    #vibes {
      background: var(--blue);
      color: var(--cream);
      position: relative;
    }
    #vibes .vibes-photo {
      position: relative;
      width: 100%;
      margin-block-start: -2px;
      overflow: hidden;
    }
    #vibes .vibes-photo::before {
      content: '';
      display: block;
      position: absolute;
      inset-block-start: 0;
      inset-inline: 0;
      height: 60px;
      background: var(--blue);
      z-index: 1;
      clip-path: ellipse(55% 100% at 50% 0%);
    }
    #vibes .vibes-photo img {
      width: 100%;
      aspect-ratio: 16/9;
      object-fit: cover;
      display: block;
    }

    /* stats bar */
    #vibes .stats-bar {
      display: flex;
      justify-content: center;
      gap: 2rem;
      padding-block-end: 3rem;
      padding-inline: 1.5rem;
    }
    #vibes .stat { text-align: center; }
    #vibes .stat-num {
      font-size: 2.2rem;
      font-weight: 900;
      color: var(--orange);
      line-height: 1;
    }
    #vibes .stat-lbl {
      font-size: 0.78rem;
      font-weight: 600;
      opacity: 0.75;
      margin-block-start: 0.2rem;
    }

    /* ─────────────────────────────────────────────────
       VISIT US SECTION
    ───────────────────────────────────────────────── */
    #visit {
      background: var(--cream);
      color: var(--espresso);
    }
    #visit .info-card {
      background: var(--white);
      border-radius: 24px;
      padding: 2rem 1.5rem;
      box-shadow: 0 4px 32px rgba(58,30,23,0.1);
      margin-block-end: 1.5rem;
      text-align: start;
    }
    #visit .info-row {
      display: flex;
      align-items: flex-start;
      gap: 0.85rem;
      margin-block-end: 1.25rem;
    }
    #visit .info-row:last-child { margin-block-end: 0; }
    #visit .info-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: var(--cream);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 1.1rem;
    }
    #visit .info-label {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--orange);
      margin-block-end: 0.2rem;
    }
    #visit .info-value {
      font-size: 0.97rem;
      font-weight: 600;
      line-height: 1.5;
    }

    #visit .hours-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.4rem 1rem;
      font-size: 0.9rem;
    }
    #visit .hours-grid .day { font-weight: 600; }
    #visit .hours-grid .time { opacity: 0.7; }

    /* ─────────────────────────────────────────────────
       FOOTER
    ───────────────────────────────────────────────── */
    #footer {
      background: var(--espresso);
      color: var(--cream);
      padding-block: 3rem 2rem;
      padding-inline: 1.5rem;
    }
    #footer .foot-logo {
      display: flex;
      justify-content: center;
      margin-block-end: 2rem;
    }
    #footer .foot-logo img { height: 44px; }
    #footer .foot-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem 1.5rem;
      margin-block-end: 2rem;
    }
    #footer .foot-links a {
      font-size: 0.88rem;
      font-weight: 600;
      opacity: 0.7;
      transition: opacity 0.2s, color 0.2s;
    }
    #footer .foot-links a:hover { opacity: 1; color: var(--orange); }
    #footer .social-row {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-block-end: 2rem;
    }
    #footer .social-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1.5px solid rgba(255,255,255,0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      transition: border-color 0.2s, background 0.2s;
    }
    #footer .social-btn:hover { border-color: var(--orange); background: var(--orange); }
    #footer .legal {
      text-align: center;
      font-size: 0.75rem;
      opacity: 0.4;
      line-height: 1.7;
    }

    /* ─────────────────────────────────────────────────
       FLOATING CTA
    ───────────────────────────────────────────────── */
    #float-cta {
      position: fixed;
      inset-block-end: 1.5rem;
      inset-inline-end: 1.25rem;
      z-index: 90;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.5rem;
    }
    #float-cta a {
      display: flex;
      align-items: center;
      gap: 0.6em;
      padding: 0.7em 1.2em;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.88rem;
      font-family: var(--font);
      box-shadow: 0 8px 28px rgba(0,0,0,0.25);
      transition: transform 0.2s var(--ease-out), box-shadow 0.2s;
    }
    #float-cta a:hover { transform: scale(1.05) translateY(-2px); box-shadow: 0 12px 36px rgba(0,0,0,0.3); }
    #float-cta .wa-btn { background: #25D366; color: #fff; }
    #float-cta .order-btn { background: var(--orange); color: #fff; }

    /* ─────────────────────────────────────────────────
       SCROLL REVEAL
    ───────────────────────────────────────────────── */
    .reveal {
      opacity: 0;
      transform: translateY(28px);
      transition: opacity 0.65s var(--ease-out), transform 0.65s var(--ease-out);
    }
    .reveal.in { opacity: 1; transform: translateY(0); }
    .reveal-delay-1 { transition-delay: 0.1s; }
    .reveal-delay-2 { transition-delay: 0.2s; }
    .reveal-delay-3 { transition-delay: 0.3s; }

    /* ─────────────────────────────────────────────────
       SQUIGGLE DRAW ANIMATION
    ───────────────────────────────────────────────── */
    .squig-draw {
      stroke-dasharray: 600;
      stroke-dashoffset: 600;
      transition: stroke-dashoffset 1.4s var(--ease-out);
    }
    .squig-draw.drawn { stroke-dashoffset: 0; }

    /* ─────────────────────────────────────────────────
       RESPONSIVE
    ───────────────────────────────────────────────── */
    @media (min-width: 768px) {
      .section-inner { padding-block: 7rem; }
      #brew .menu-grid { grid-template-columns: repeat(4, 1fr); }
      #vibes .stats-bar { gap: 4rem; }
      #visit .info-card { padding: 2.5rem; }
    }
  </style>
</head>
<body>

<!-- ═══════════════════════════════════════════════
     OVERLAY MENU
═══════════════════════════════════════════════ -->
<div id="overlay" role="dialog" aria-modal="true" aria-label="Menu">
  <!-- doodle bg -->
  <svg class="doodle-bg" viewBox="0 0 400 700" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M30 80 Q80 40 130 80 Q180 120 230 80 Q280 40 330 80 Q380 120 430 80" stroke="#FFF6E9" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M30 160 Q80 120 130 160 Q180 200 230 160 Q280 120 330 160 Q380 200 430 160" stroke="#FFF6E9" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M30 240 Q80 200 130 240 Q180 280 230 240 Q280 200 330 240 Q380 280 430 240" stroke="#FFF6E9" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M30 320 Q80 280 130 320 Q180 360 230 320 Q280 280 330 320 Q380 360 430 320" stroke="#FFF6E9" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M30 400 Q80 360 130 400 Q180 440 230 400 Q280 360 330 400 Q380 440 430 400" stroke="#FFF6E9" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M30 480 Q80 440 130 480 Q180 520 230 480 Q280 440 330 480 Q380 520 430 480" stroke="#FFF6E9" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M30 560 Q80 520 130 560 Q180 600 230 560 Q280 520 330 560 Q380 600 430 560" stroke="#FFF6E9" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M30 640 Q80 600 130 640 Q180 680 230 640 Q280 600 330 640 Q380 680 430 640" stroke="#FFF6E9" stroke-width="3" fill="none" stroke-linecap="round"/>
  </svg>

  <nav id="overlay-nav">
    <!-- JS fills links here -->
  </nav>

  <p class="overlay-tagline">BREW • BITES • VIBES</p>
</div>

<!-- ═══════════════════════════════════════════════
     HEADER
═══════════════════════════════════════════════ -->
<header id="header">
  <!-- language toggle -->
  <button id="lang-btn" data-i18n="langToggle" aria-label="Switch language">EN</button>

  <!-- logo (center) -->
  <a href="#" class="logo" aria-label="ONZGO Home">
    <!-- REPLACE: logo-light.svg is the light/cream variant for dark header bg -->
    <img id="header-logo" src="/assets/logo-light.svg" alt="ONZGO Logo"/>
  </a>

  <!-- hamburger -->
  <button id="burger" aria-label="Open menu" aria-expanded="false" aria-controls="overlay">
    <span></span>
    <span></span>
    <span></span>
  </button>
</header>

<!-- ═══════════════════════════════════════════════
     HERO
═══════════════════════════════════════════════ -->
<section id="hero" aria-label="Hero">

  <!-- hand-drawn squiggle texture -->
  <svg class="squiggle-field" viewBox="0 0 800 900" fill="none" preserveAspectRatio="xMidYMid slice">
    <path d="M0 60 Q100 20 200 60 Q300 100 400 60 Q500 20 600 60 Q700 100 800 60" stroke="#F26B1D" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M0 140 Q100 100 200 140 Q300 180 400 140 Q500 100 600 140 Q700 180 800 140" stroke="#C9A579" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M0 220 Q100 180 200 220 Q300 260 400 220 Q500 180 600 220 Q700 260 800 220" stroke="#F26B1D" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M0 700 Q100 660 200 700 Q300 740 400 700 Q500 660 600 700 Q700 740 800 700" stroke="#F26B1D" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M0 780 Q100 740 200 780 Q300 820 400 780 Q500 740 600 780 Q700 820 800 780" stroke="#C9A579" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M0 860 Q100 820 200 860 Q300 900 400 860 Q500 820 600 860 Q700 900 800 860" stroke="#F26B1D" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- loop doodle left -->
    <path d="M60 380 Q40 350 70 330 Q100 310 110 340 Q120 370 90 385 Q60 400 65 430 Q70 460 95 455" stroke="#FFF6E9" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- sleepy eye doodle right -->
    <path d="M720 450 Q740 430 760 450 Q740 470 720 450Z" stroke="#FFF6E9" stroke-width="2" fill="none"/>
    <circle cx="740" cy="450" r="4" fill="#FFF6E9" opacity="0.6"/>
  </svg>

  <!-- cup image placeholder -->
  <div class="cup-wrap">
    <!-- REPLACE: cup-hero.jpg — the kraft ONZGO cup with sleeves -->
    <img src="https://images.unsplash.com/photo-1509785307050-d4066910ec1e?q=80&w=700&auto=format&fit=crop"

    floatOrder: 'Order Now',
  }
};

/* ─────────────────────────────────────────────────
   LANGUAGE SYSTEM
───────────────────────────────────────────────── */
let currentLang = localStorage.getItem('onzgo-lang') || 'ar';

function setLang(lang) {
  currentLang = lang;
  localStorage.setItem('onzgo-lang', lang);

  const html = document.documentElement;
  html.lang = lang;
  html.dir = lang === 'ar' ? 'rtl' : 'ltr';
  html.classList.toggle('rtl', lang === 'ar');

  // update all data-i18n elements
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.dataset.i18n;
    if (CONTENT[lang][key] !== undefined) {
      // handle multiline (footerLegal)
      el.innerHTML = CONTENT[lang][key].replace(/\n/g, '<br>');
    }
  });

  // mirror floating arrow
  const orderBtn = document.querySelector('#float-cta .order-btn');
  if (orderBtn) {
    orderBtn.innerHTML = `<span data-i18n="floatOrder">${CONTENT[lang].floatOrder}</span> ${lang === 'ar' ? '←' : '→'}`;
  }

  // rebuild overlay nav
  buildOverlayNav();

  // mirror overlay slide direction
  const overlay = document.getElementById('overlay');
  // direction is handled by CSS via html[dir]
}

function buildOverlayNav() {
  const t = CONTENT[currentLang];
  const navEl = document.getElementById('overlay-nav');
  navEl.innerHTML = `
    <a href="#brew"  onclick="closeMenu()">${t.navBrew}</a>
    <a href="#bites" onclick="closeMenu()">${t.navBites}</a>
    <a href="#vibes" onclick="closeMenu()">${t.navVibes}</a>
    <a href="#visit" onclick="closeMenu()">${t.navVisit}</a>
  `;
}

/* ─────────────────────────────────────────────────
   HAMBURGER / OVERLAY
───────────────────────────────────────────────── */
const burger  = document.getElementById('burger');
const overlay = document.getElementById('overlay');

function openMenu() {
  burger.classList.add('open');
  overlay.classList.add('open');
  burger.setAttribute('aria-expanded', 'true');
  document.body.style.overflow = 'hidden';
}
function closeMenu() {
  burger.classList.remove('open');
  overlay.classList.remove('open');
  burger.setAttribute('aria-expanded', 'false');
  document.body.style.overflow = '';
}

burger.addEventListener('click', () => {
  overlay.classList.contains('open') ? closeMenu() : openMenu();
});

// close on ESC
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeMenu(); });

/* ─────────────────────────────────────────────────
   LANGUAGE TOGGLE
───────────────────────────────────────────────── */
document.getElementById('lang-btn').addEventListener('click', () => {
  setLang(currentLang === 'ar' ? 'en' : 'ar');
});

/* ─────────────────────────────────────────────────
   HEADER SCROLL STATE
───────────────────────────────────────────────── */
const header = document.getElementById('header');
window.addEventListener('scroll', () => {
  header.classList.toggle('scrolled', window.scrollY > 40);
}, { passive: true });

/* ─────────────────────────────────────────────────
   SCROLL REVEAL (IntersectionObserver)
───────────────────────────────────────────────── */
const revealObserver = new IntersectionObserver(entries => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.classList.add('in');
      revealObserver.unobserve(entry.target);
    }
  });
}, { threshold: 0.12 });

document.querySelectorAll('.reveal').forEach(el => revealObserver.observe(el));

/* ─────────────────────────────────────────────────
   SQUIGGLE DRAW ANIMATION
───────────────────────────────────────────────── */
const squigObserver = new IntersectionObserver(entries => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.classList.add('drawn');
      squigObserver.unobserve(entry.target);
    }
  });
}, { threshold: 0.3 });

document.querySelectorAll('.squig-draw').forEach(el => squigObserver.observe(el));

/* ─────────────────────────────────────────────────
   INIT
───────────────────────────────────────────────── */
setLang(currentLang);
</script>
